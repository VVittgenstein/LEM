[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lem-viewer"
version = "0.1.0"
description = "Interactive multi-channel terrain viewer for LEM-Diffusion"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "PySide6>=6.6",
    "pyqtgraph>=0.13",
    "PyOpenGL>=3.1",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]
hdf5 = ["h5py>=3.10"]
zarr = ["zarr>=2.16"]

[project.scripts]
lem-viewer = "lem_viewer.main:main"

[tool.setuptools]
packages = [
    "lem_viewer", "lem_viewer.channels", "lem_viewer.loaders",
    "lem_viewer.ui", "lem_viewer.views", "lem_viewer.voxel", "lem_pipeline",
]

[tool.setuptools.package-dir]
lem_viewer = "viewer/lem_viewer"
lem_pipeline = "experiments/lem_pipeline"

[tool.setuptools.package-data]
lem_viewer = ["voxel/*.md", "voxel/*.txt", "voxel/native/*.cpp", "voxel/native/*.h", "voxel/native/*.md", "voxel/native/CMakeLists.txt", "voxel/native/core/*.cpp", "voxel/native/core/*.h"]

[tool.pytest.ini_options]
# The full suite uses tests/run.py to select each group's Python environment.
testpaths = ["tests/viewer"]
pythonpath = ["viewer", "experiments"]
addopts = "--import-mode=importlib"
